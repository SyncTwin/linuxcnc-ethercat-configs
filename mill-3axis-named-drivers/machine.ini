# Generated by AICNC mill-is620n machine constructor
# Hardware: Inovance IS620N EtherCAT servo drives, CIA402/CSP mode
# Scale per axis from AxisDrive SSOT (enc_cpr/lead/gear) — see machine record
# Effective pos scale (per [JOINT_N] SCALE): X=838860.8, Y=838860.8, Z=838860.8 counts/mm

[EMC]
VERSION = 1.1
MACHINE = IS620N-XYZ
DEBUG = 0

[DISPLAY]
# No INTRO_GRAPHIC — the splash (popimage) needs Tk and fails under the headless
# linuxcncrsh front-end, spamming the launch log. Axis GUI doesn't need it.
INTRO_TIME = 0
DISPLAY = linuxcncrsh
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.0
MAX_LINEAR_VELOCITY = 50.000
DEFAULT_LINEAR_VELOCITY = 5.000
PROGRAM_PREFIX = /home/cnc/linuxcnc/nc_files
INCREMENTS = 10mm, 1mm, 0.1mm, 0.01mm
OPEN_FILE =

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = wcs_d92b5b0d-a7fe-41da-ae91-e0b881784002.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tools.tbl

[HAL]
HALFILE = machine.hal
HALFILE = io.hal
HALUI = halui

[TRAJ]
NO_FORCE_HOMING = 1
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 50.000
DEFAULT_LINEAR_VELOCITY = 5.000
DEFAULT_LINEAR_ACCELERATION = 200.0
MAX_LINEAR_ACCELERATION = 500.0

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[AXIS_X]
